- name: ntp
  type: group
  version: 9.1.0 # version added
  release: beta
  description: >
    `ntp` contains Network Time Protocol (NTP) metrics.
  fields:
  - name: host
    type: keyword
    description: >
      The remote NTP server address.
  - name: offset
    type: long
    description: >
      The estimated offset of the local host's system clock relative to the server's clock (in ns).